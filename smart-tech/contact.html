<body>

  <div id="header-placeholder"></div>

  <section class="page-hero">
    <div class="container page-hero-content">
      <div class="eyebrow" style="color:var(--color-accent-light);">Get in Touch</div>
      <h1 class="page-hero-title">Contact Us</h1>
      <p class="page-hero-subtitle">Questions about a phone, order, or accessory? We're a message away.</p>
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a><span class="breadcrumb-sep">›</span>
        <span class="breadcrumb-current">Contact</span>
      </nav>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="grid grid-2" style="gap:var(--space-12);align-items:flex-start;">
        <div>
          <div style="display:flex;flex-direction:column;gap:var(--space-5);">
            <div style="display:flex;gap:var(--space-4);align-items:flex-start;">
              <div style="width:48px;height:48px;background:rgba(47,143,255,0.1);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:1.3rem;">📍</div>
              <div><strong style="display:block;margin-bottom:4px;">Shop</strong><span style="color:var(--color-text-light);font-size:var(--text-sm);">Douala, Cameroon</span></div>
            </div>
            <div style="display:flex;gap:var(--space-4);align-items:flex-start;">
              <div style="width:48px;height:48px;background:rgba(47,143,255,0.1);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:1.3rem;">📞</div>
              <div><strong style="display:block;margin-bottom:4px;">Phone / WhatsApp</strong><a href="tel:+237670735947" style="color:var(--color-accent);font-size:var(--text-sm);">+237 670 735 947</a></div>
            </div>
            <div style="display:flex;gap:var(--space-4);align-items:flex-start;">
              <div style="width:48px;height:48px;background:rgba(47,143,255,0.1);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:1.3rem;">✉️</div>
              <div><strong style="display:block;margin-bottom:4px;">Email</strong><a href="mailto:tech@kennegroup.com" style="color:var(--color-accent);font-size:var(--text-sm);">tech@kennegroup.com</a></div>
            </div>
            <div style="display:flex;gap:var(--space-4);align-items:flex-start;">
              <div style="width:48px;height:48px;background:rgba(47,143,255,0.1);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:1.3rem;">🕒</div>
              <div><strong style="display:block;margin-bottom:4px;">Hours</strong><span style="color:var(--color-text-light);font-size:var(--text-sm);">Mon–Sat: 8am–6pm</span></div>
            </div>
          </div>
        </div>
        <form class="card" style="padding:var(--space-8);" onsubmit="event.preventDefault(); if(typeof showToast==='function') showToast('✓ Message sent — we\\'ll reply shortly.'); this.reset();">
          <div class="form-group" style="margin-bottom:var(--space-4);"><label class="form-label">Name *</label><input type="text" class="form-control" required></div>
          <div class="form-group" style="margin-bottom:var(--space-4);"><label class="form-label">Email *</label><input type="email" class="form-control" required></div>
          <div class="form-group" style="margin-bottom:var(--space-4);"><label class="form-label">Phone</label><input type="tel" class="form-control"></div>
          <div class="form-group" style="margin-bottom:var(--space-6);"><label class="form-label">Message *</label><textarea class="form-control" rows="4" required></textarea></div>
          <button type="submit" class="btn btn--primary btn--full">Send Message</button>
        </form>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>
  <button id="back-to-top" aria-label="Back to top">↑</button>
