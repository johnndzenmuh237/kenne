</head>
<body>

  <div id="header-placeholder"></div>

  <section class="page-hero">
    <div class="container page-hero-content">
      <div class="eyebrow" style="color:var(--color-accent-light);">Accessories</div>
      <h1 class="page-hero-title">Universal Accessories</h1>
      <p class="page-hero-subtitle">Every item below fits Samsung, iPhone, Tecno, Infinix and Itel devices.</p>
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a><span class="breadcrumb-sep">›</span>
        <span class="breadcrumb-current">Accessories</span>
      </nav>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="filter-chip-row" id="acc-cats" style="margin-bottom:var(--space-8);"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-5);">
        <span style="font-size:var(--text-sm);color:var(--color-text-light);" id="acc-count"></span>
        <input type="text" id="acc-search" class="form-control" style="max-width:260px;" placeholder="Search accessories…">
      </div>
      <div class="product-grid" id="acc-grid"></div>
      <p id="acc-no-results" style="display:none;text-align:center;color:var(--color-text-light);padding:var(--space-12) 0;">No accessories match your search.</p>
    </div>
  </section>

  <div id="footer-placeholder"></div>
  <button id="back-to-top" aria-label="Back to top">↑</button>

  <script>window.CART_NAMESPACE = 'kenne_tech';</script>
  <script src="assets/js/products-data.js"></script>
  <script src="assets/js/shop.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/drawer.js"></script>
  <script src="assets/js/ai-support.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    const cats = ['All', ...new Set(ACCESSORIES_DATA.map(a => a.category))];
    document.getElementById('acc-cats').innerHTML = cats.map((c, i) =>
      `<button type="button" class="filter-chip ${i === 0 ? 'active' : ''}" data-cat="${c === 'All' ? '' : c}">${c}</button>`
    ).join('');

    let accState = { cat: '', search: '' };

    function renderAccessories() {
      const list = ACCESSORIES_DATA.filter(a =>
        (!accState.cat || a.category === accState.cat) &&
        (!accState.search || a.name.toLowerCase().includes(accState.search))
      );
      document.getElementById('acc-count').textContent = `${list.length} accessor${list.length !== 1 ? 'ies' : 'y'} found`;
      document.getElementById('acc-grid').innerHTML = list.map(renderProductCard).join('');
      document.getElementById('acc-no-results').style.display = list.length === 0 ? 'block' : 'none';
    }

    document.getElementById('acc-cats').addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-chip'); if (!btn) return;
      document.querySelectorAll('#acc-cats .filter-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      accState.cat = btn.dataset.cat;
      renderAccessories();
    });

    document.getElementById('acc-search').addEventListener('input', (e) => {
      accState.search = e.target.value.toLowerCase();
      renderAccessories();
    });

    renderAccessories();
  </script>
  <script src="../assets/js/site-extras.js"></script>
</body>
</html>
