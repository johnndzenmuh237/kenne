<html lang="en">
<head>

  <meta property="og:type" content="website">

  <meta property="og:description" content="Rent a car with Kenne Car Business — self-drive or with a driver, daily rates, available across Cameroon.">

  <meta property="og:image" content="https://www.kennegroup.com/favicon.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Car Rentals | Kenne Car Business">

  <meta name="theme-color" content="#0A0E27">
</head>
<body>

  <div id="header-placeholder"></div>

  <section class="page-hero">
    <div class="container page-hero-content">
      <div class="eyebrow" style="color:var(--color-accent-light);">Rentals</div>
      <h1 class="page-hero-title">Car Rentals</h1>
      <p class="page-hero-subtitle">Self-drive or with a driver — daily rates, available across Cameroon.</p>
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a><span class="breadcrumb-sep">›</span>
        <span class="breadcrumb-current">Rentals</span>
      </nav>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="product-grid" id="rentals-grid"></div>
    </div>
  </section>

  <section class="section bg-light">
    <div class="container">
      <div class="grid grid-3 stagger-children">
        <div class="card" style="padding:var(--space-6);text-align:center;">
          <div style="font-size:2.2rem;margin-bottom:var(--space-3);">📅</div>
          <h4 style="margin-bottom:6px;">Flexible Dates</h4>
          <p style="font-size:var(--text-sm);color:var(--color-text-light);">Daily, weekly, or event-based bookings</p>
        </div>
        <div class="card" style="padding:var(--space-6);text-align:center;">
          <div style="font-size:2.2rem;margin-bottom:var(--space-3);">🧑‍✈️</div>
          <h4 style="margin-bottom:6px;">Driver Optional</h4>
          <p style="font-size:var(--text-sm);color:var(--color-text-light);">Self-drive or with an experienced driver</p>
        </div>
        <div class="card" style="padding:var(--space-6);text-align:center;">
          <div style="font-size:2.2rem;margin-bottom:var(--space-3);">🛡️</div>
          <h4 style="margin-bottom:6px;">Fully Insured</h4>
          <p style="font-size:var(--text-sm);color:var(--color-text-light);">Every rental vehicle is insured &amp; serviced</p>
        </div>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>
  <button id="back-to-top" aria-label="Back to top">↑</button>

  <script>window.CART_NAMESPACE = 'kenne_cars';</script>
  <script src="assets/js/cars-data.js"></script>
  <script src="assets/js/shop.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/drawer.js"></script>
  <script src="assets/js/ai-support.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const rentals = CARS_DATA.filter(c => c.category === 'rental');
      document.getElementById('rentals-grid').innerHTML = rentals.map(renderCarCard).join('');
    });
  </script>
  <script src="../assets/js/site-extras.js"></script>
</body>
</html>
