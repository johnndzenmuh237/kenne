<body>

  <div id="header-placeholder"></div>

  <section class="page-hero">
    <div class="container page-hero-content">
      <div class="eyebrow" style="color:var(--color-accent-light);">Parts Shop</div>
      <h1 class="page-hero-title">Parts &amp; Accessories</h1>
      <p class="page-hero-subtitle">Genuine parts for every make and model, at fair prices.</p>
      <nav class="breadcrumb" aria-label="Breadcrumb">

      </nav>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="filter-chip-row" id="part-cats" style="margin-bottom:var(--space-8);"></div>
      <div class="product-grid" id="parts-grid"></div>
    </div>
  </section>

  <div id="footer-placeholder"></div>
  <button id="back-to-top" aria-label="Back to top">↑</button>

  <script>window.CART_NAMESPACE = 'kenne_cars';</script>
  <script src="assets/js/cars-data.js"></script>
  <script src="assets/js/shop.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/drawer.js"></script>
  <script src="assets/js/ai-support.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    const cats = ['All', ...new Set(CAR_PARTS_DATA.map(p => p.category))];
    document.getElementById('part-cats').innerHTML = cats.map((c, i) =>
      `<button type="button" class="filter-chip ${i === 0 ? 'active' : ''}" data-cat="${c === 'All' ? '' : c}">${c}</button>`
    ).join('');

    function renderParts(cat) {
      const list = cat ? CAR_PARTS_DATA.filter(p => p.category === cat) : CAR_PARTS_DATA;
      document.getElementById('parts-grid').innerHTML = list.map(renderPartCard).join('');
    }

    document.getElementById('part-cats').addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-chip'); if (!btn) return;
      document.querySelectorAll('#part-cats .filter-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderParts(btn.dataset.cat);
    });

    renderParts('');
  </script>
  <script src="../assets/js/site-extras.js"></script>
</body>
