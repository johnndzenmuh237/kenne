<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Car details — Kenne Car Business. Full specs, gallery, and instant checkout with pay now or pay on delivery.">
  <title id="page-title">Car Details | Kenne Car Business</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/themes.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="canonical" href="https://www.kennegroup.com/cars/car-detail.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="KENNE">
  <meta property="og:title" content="Car Details | Kenne Car Business">
  <meta property="og:description" content="Car details — Kenne Car Business. Full specs, gallery, and instant checkout with pay now or pay on delivery.">
  <meta property="og:url" content="https://www.kennegroup.com/cars/car-detail.html">
  <meta property="og:image" content="https://www.kennegroup.com/favicon.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Car Details | Kenne Car Business">
  <meta name="twitter:description" content="Car details — Kenne Car Business. Full specs, gallery, and instant checkout with pay now or pay on delivery.">
  <meta name="theme-color" content="#0A0E27">
</head>
<body>

  <div id="header-placeholder"></div>

  <section class="section" style="padding-top:calc(var(--header-height) + var(--space-8));">
    <div class="container">
      <nav class="breadcrumb" aria-label="Breadcrumb" style="margin-bottom:var(--space-6);">
        <a href="index.html">Home</a><span class="breadcrumb-sep">›</span>
        <a href="inventory.html" id="crumb-parent">Inventory</a><span class="breadcrumb-sep">›</span>
        <span class="breadcrumb-current" id="crumb-name">Car</span>
      </nav>

      <div id="pd-content" class="pd-layout"></div>
    </div>
  </section>

  <section class="section bg-light">
    <div class="container">
      <div class="section-header section-header--center reveal">
        <div class="eyebrow">You Might Also Like</div>
        <h2 class="section-title">Similar <span>Vehicles</span></h2>
      </div>
      <div class="product-grid" id="related-cars"></div>
    </div>
  </section>

  <div id="footer-placeholder"></div>
  <button id="back-to-top" aria-label="Back to top">↑</button>

  <script>window.CART_NAMESPACE = 'kenne_cars';</script>
  <script src="assets/js/cars-data.js"></script>
  <script src="assets/js/shop.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/drawer.js"></script>
  <script src="assets/js/ai-support.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    const car = CARS_DATA.find(c => c.id === getQueryParam('id')) || CARS_DATA[0];
    document.getElementById('page-title').textContent = `${car.name} | Kenne Car Business`;
    document.getElementById('crumb-name').textContent = car.name;

    const isRental = car.category === 'rental';
    if (isRental) {
      document.getElementById('crumb-parent').textContent = 'Rentals';
      document.getElementById('crumb-parent').href = 'rentals.html';
    }

    const priceHtml = car.priceUnit
      ? `${formatCFA(car.price)} <span style="font-size:var(--text-base);color:var(--color-text-light);font-weight:600;">${car.priceUnit}</span>`
      : formatCFA(car.price);

    // Action area differs for rentals (book on WhatsApp) vs cars for sale (add to cart)
    const actionsHtml = isRental
      ? `
        <div style="display:flex;gap:var(--space-3);flex-wrap:wrap;">
          <a href="${whatsappBookingLink(car)}" target="_blank" rel="noopener" class="btn btn--primary btn--lg">📱 Book on WhatsApp</a>
          <button class="btn btn--outline btn--lg" onclick="addCarToCart()">🛒 Add Booking to Cart</button>
        </div>
        <p style="font-size:12px;color:var(--color-text-light);margin-top:var(--space-3);">
          By booking, you agree to our <a href="rentals.html#terms" style="color:var(--color-accent);">rental terms &amp; conditions</a> (ID, deposit, fuel &amp; mileage policy).
        </p>`
      : `
        <div style="display:flex;gap:var(--space-3);flex-wrap:wrap;">
          <button class="btn btn--primary btn--lg" onclick="addCarToCart()">🛒 Add to Cart</button>
          <a href="${whatsappBookingLink(car)}" target="_blank" rel="noopener" class="btn btn--outline btn--lg">💬 Ask on WhatsApp</a>
        </div>`;

    document.getElementById('pd-content').innerHTML = `
      <div>
        <div class="pd-gallery-main"><img id="pd-main-img" src="${car.gallery[0]}" alt="${car.name}" onerror="this.src='https://images.unsplash.com/photo-1494976388531-d1058494cdd8?auto=format&fit=crop&w=900&q=80';"></div>
        <div class="pd-gallery-thumbs">
          ${car.gallery.map((g, i) => `<img src="${g}" alt="${car.name} — photo ${i + 1}" class="${i === 0 ? 'active' : ''}" onerror="this.style.display='none';" onclick="document.getElementById('pd-main-img').src='${g}';document.querySelectorAll('.pd-gallery-thumbs img').forEach(t=>t.classList.remove('active'));this.classList.add('active');">`).join('')}
        </div>
      </div>
      <div>
        <span class="product-card__badge" style="position:static;display:inline-block;margin-bottom:var(--space-3);">${carBadge(car)}</span>
        <h1 style="font-family:var(--font-display);font-size:var(--text-3xl);color:var(--color-navy);margin-bottom:var(--space-2);">${car.name}</h1>
        <div class="pd-price">${priceHtml}</div>
        <p style="color:var(--color-text-light);margin:var(--space-4) 0;line-height:1.7;">${car.description}</p>
        <div class="pd-specs">
          <div class="pd-spec-item"><span>Make</span><strong>${car.make}</strong></div>
          <div class="pd-spec-item"><span>Year</span><strong>${car.year}</strong></div>
          <div class="pd-spec-item"><span>Body Type</span><strong>${car.bodyType}</strong></div>
          <div class="pd-spec-item"><span>Mileage</span><strong>${car.mileage}</strong></div>
          <div class="pd-spec-item"><span>Fuel</span><strong>${car.fuel}</strong></div>
          <div class="pd-spec-item"><span>Transmission</span><strong>${car.transmission}</strong></div>
          ${car.seats ? `<div class="pd-spec-item"><span>Seats</span><strong>${car.seats}</strong></div>` : ''}
          ${car.drivetrain ? `<div class="pd-spec-item"><span>Drivetrain</span><strong>${car.drivetrain}</strong></div>` : ''}
          ${car.color ? `<div class="pd-spec-item"><span>Color</span><strong>${car.color}</strong></div>` : ''}
        </div>
        ${!isRental ? `
        <div class="pd-qty-row">
          <span style="font-size:var(--text-sm);font-weight:600;">Quantity</span>
          <div class="qty-stepper">
            <button type="button" onclick="stepQty(-1)">−</button>
            <input type="text" id="pd-qty" value="1" readonly>
            <button type="button" onclick="stepQty(1)">+</button>
          </div>
        </div>` : `
        <div class="pd-qty-row">
          <span style="font-size:var(--text-sm);font-weight:600;">Rental Days</span>
          <div class="qty-stepper">
            <button type="button" onclick="stepQty(-1)">−</button>
            <input type="text" id="pd-qty" value="1" readonly>
            <button type="button" onclick="stepQty(1)">+</button>
          </div>
        </div>`}
        ${actionsHtml}
      </div>
    `;

    function stepQty(delta) {
      const input = document.getElementById('pd-qty');
      const next = Math.max(1, parseInt(input.value || '1') + delta);
      input.value = next;
    }

    function addCarToCart() {
      const qty = parseInt(document.getElementById('pd-qty')?.value || '1');
      window.KenneCart.addItem({ id: car.id, name: car.name, price: car.price, image: car.image }, qty);
    }

    // Related cars: same body type, excluding current
    document.addEventListener('DOMContentLoaded', () => {
      const pool = isRental ? CARS_DATA.filter(c => c.category === 'rental') : CARS_DATA.filter(c => c.category !== 'rental');
      const related = pool.filter(c => c.id !== car.id && c.bodyType === car.bodyType).slice(0, 3);
      const fallback = related.length ? related : pool.filter(c => c.id !== car.id).slice(0, 3);
      document.getElementById('related-cars').innerHTML = fallback.map(renderCarCard).join('');
    });
  </script>
  <script src="../assets/js/site-extras.js"></script>
</body>
</html>
