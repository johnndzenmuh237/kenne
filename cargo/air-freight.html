<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KENNE Cargo air freight — China to Cameroon in 5–10 days. See current rates by weight and get an instant quote.">
  <title>Air Freight | KENNE Cargo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/themes.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    .rates-table { width:100%; border-collapse:collapse; }
    .rates-table th { text-align:left; background:var(--color-navy); color:#fff; padding:12px 16px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; }
    .rates-table td { padding:12px 16px; border-bottom:var(--border-light); font-size:var(--text-sm); }
    .rates-table tr:nth-child(even) { background:var(--color-off-white); }
  </style>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="canonical" href="https://www.kennegroup.com/cargo/air-freight.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="KENNE">
  <meta property="og:title" content="Air Freight | KENNE Cargo">
  <meta property="og:description" content="KENNE Cargo air freight — China to Cameroon in 5–10 days. See current rates by weight and get an instant quote.">
  <meta property="og:url" content="https://www.kennegroup.com/cargo/air-freight.html">
  <meta property="og:image" content="https://www.kennegroup.com/favicon.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Air Freight | KENNE Cargo">
  <meta name="twitter:description" content="KENNE Cargo air freight — China to Cameroon in 5–10 days. See current rates by weight and get an instant quote.">
  <meta name="theme-color" content="#0A0E27">
</head>
<body>

  <div id="header-placeholder"></div>

  <section class="page-hero">
    <div class="container page-hero-content">
      <div class="eyebrow" style="color:var(--color-accent-light);">Shipping Services</div>
      <h1 class="page-hero-title">✈️ Air Freight</h1>
      <p class="page-hero-subtitle">China to Cameroon — fast, priced by weight.</p>
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a><span class="breadcrumb-sep">›</span>
        <span class="breadcrumb-current">Air Freight</span>
      </nav>
    </div>
  </section>

  <section class="section">
    <div class="container" style="max-width:820px;">

      <div class="grid grid-3 stagger-children" style="margin-bottom:var(--space-10);">
        <div class="card" style="padding:var(--space-5);text-align:center;">
          <div style="font-size:1.8rem;margin-bottom:8px;">⏱️</div>
          <strong id="duration-display">5 – 10 days</strong>
          <p style="font-size:12px;color:var(--color-text-light);">Estimated transit time</p>
        </div>
        <div class="card" style="padding:var(--space-5);text-align:center;">
          <div style="font-size:1.8rem;margin-bottom:8px;">⚖️</div>
          <strong id="min-display">4 KG</strong>
          <p style="font-size:12px;color:var(--color-text-light);">Minimum billable weight</p>
        </div>
        <div class="card" style="padding:var(--space-5);text-align:center;">
          <div style="font-size:1.8rem;margin-bottom:8px;">📦</div>
          <strong>1 – 3 days</strong>
          <p style="font-size:12px;color:var(--color-text-light);">Ship-out after warehouse receipt</p>
        </div>
      </div>

      <h2 style="font-family:var(--font-display);font-size:var(--text-2xl);color:var(--color-navy);margin-bottom:var(--space-4);">Current Rates</h2>
      <div class="card" style="padding:0;overflow:hidden;margin-bottom:var(--space-6);">
        <table class="rates-table">
          <thead><tr><th>Weight Range</th><th>Price per KG</th></tr></thead>
          <tbody id="rate-rows"></tbody>
        </table>
      </div>

      <div class="card" style="padding:var(--space-6);margin-bottom:var(--space-8);background:rgba(242,185,12,0.08);border-color:rgba(242,185,12,0.3);">
        <p style="font-size:var(--text-sm);margin:0;" id="shipout-note"></p>
      </div>

      <div class="text-center">
        <a href="get-quote.html" class="btn btn--primary btn--lg">Get an Instant Quote →</a>
      </div>

    </div>
  </section>

  <div id="footer-placeholder"></div>
  <button id="back-to-top" aria-label="Back to top">↑</button>

  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/drawer.js"></script>
  <script src="assets/js/cargo-shipping.js"></script>
  <script src="assets/js/ai-support.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const rates = window.KenneCargoShipping.getRates();
      document.getElementById('duration-display').textContent = rates.air.durationText;
      document.getElementById('min-display').textContent = rates.air.minBillableKg + ' KG';
      document.getElementById('shipout-note').textContent = rates.air.shipOutText;
      document.getElementById('rate-rows').innerHTML = rates.air.brackets.map(b => `
        <tr><td>${b.minKg} – ${b.maxKg ?? '+'} KG</td><td>${window.KenneCargoShipping.formatMoney(b.pricePerKg)}</td></tr>
      `).join('');
    });
  </script>
  <script src="../assets/js/site-extras.js"></script>
</body>
</html>
