<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="KENNE Cargo staff tool — register shipments and send stage-by-stage tracking updates to customers.">
  <title>Shipment Update Center | KENNE Cargo Staff</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/themes.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    .staff-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(242,185,12,0.14);color:var(--color-accent-dark);font-size:var(--text-xs);font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:6px 14px;border-radius:999px;margin-bottom:var(--space-4);}
    .shipment-row { display:flex; justify-content:space-between; align-items:center; padding:var(--space-4); background:var(--color-off-white); border-radius:var(--radius-md); margin-bottom:8px; cursor:pointer; transition:background .15s; }
    .shipment-row:hover { background:#eef0f5; }
    .shipment-row.active { background:rgba(242,185,12,0.14); }
    .stage-item { display:flex; gap:var(--space-4); align-items:flex-start; padding:var(--space-4) 0; border-bottom:1px dashed var(--color-border); }
    .stage-dot { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0; }
    .stage-dot.done { background:#0a6e46; color:#fff; }
    .stage-dot.current { background:var(--color-accent); color:var(--color-navy); }
    .stage-dot.pending { background:var(--color-border); color:var(--color-gray); }
    .modal-overlay { position:fixed; inset:0; background:rgba(10,22,40,0.6); z-index:5000; display:flex; align-items:center; justify-content:center; padding:20px; }
    .modal-box { background:#fff; border-radius:var(--radius-xl); padding:var(--space-8); max-width:480px; width:100%; max-height:90vh; overflow-y:auto; }
  </style>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

  <div id="header-placeholder"></div>

  <section class="page-hero" style="padding-top:calc(var(--space-24) + 40px);padding-bottom:var(--space-8);">
    <div class="container page-hero-content">
      <span class="staff-badge">🔒 Staff Tool</span>
      <h1 class="page-hero-title" style="font-size:var(--text-4xl);">Cargo Shipment Update Center</h1>
      <p class="page-hero-subtitle">Register shipments, then send a stage-by-stage notification the moment each physical event happens.</p>
    </div>
  </section>

  <section class="section" style="padding-top:var(--space-4);">
    <div class="container">
      <div class="grid grid-2" style="grid-template-columns: 340px 1fr; gap:var(--space-8);align-items:flex-start;">

        <!-- LEFT: register + list -->
        <div>
          <div class="card" style="padding:var(--space-6);margin-bottom:var(--space-6);">
            <h3 style="font-size:var(--text-base);margin-bottom:var(--space-4);">📦 Register New Shipment</h3>
            <form id="register-form">
              <div class="form-group" style="margin-bottom:var(--space-3);"><label class="form-label">Customer Name *</label><input type="text" id="r-name" class="form-control" required></div>
              <div class="form-group" style="margin-bottom:var(--space-3);"><label class="form-label">Email *</label><input type="email" id="r-email" class="form-control" required></div>
              <div class="form-group" style="margin-bottom:var(--space-3);"><label class="form-label">Phone / WhatsApp *</label><input type="tel" id="r-phone" class="form-control" required></div>
              <div class="form-group" style="margin-bottom:var(--space-3);"><label class="form-label">Goods Description *</label><input type="text" id="r-goods" class="form-control" required></div>
              <div class="form-group" style="margin-bottom:var(--space-3);">
                <label class="form-label">Method *</label>
                <select id="r-method" class="form-control" required>
                  <option value="air">Air Freight</option>
                  <option value="sea">Sea Freight</option>
                </select>
              </div>
              <div class="form-group" style="margin-bottom:var(--space-4);"><label class="form-label">Shipping Cost (CFA)</label><input type="number" id="r-cost" class="form-control"></div>
              <button type="submit" class="btn btn--primary btn--full">Register Shipment</button>
            </form>
          </div>

          <div class="card" style="padding:var(--space-6);">
            <h3 style="font-size:var(--text-base);margin-bottom:var(--space-4);">All Shipments</h3>
            <div id="shipment-list"></div>
          </div>
        </div>

        <!-- RIGHT: selected shipment detail -->
        <div id="shipment-detail">
          <div class="card" style="padding:var(--space-12);text-align:center;color:var(--color-text-light);">
            Register or select a shipment to manage its tracking stages.
          </div>
        </div>

      </div>
    </div>
  </section>

  <div id="modal-root"></div>

  <div id="footer-placeholder"></div>
  <button id="back-to-top" aria-label="Back to top">↑</button>

  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/drawer.js"></script>
  <script src="assets/js/cargo-shipping.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    const K = window.KenneCargoShipping;
    let selectedTracking = null;

    function renderShipmentList() {
      const shipments = K.listShipments();
      const host = document.getElementById('shipment-list');
      if (shipments.length === 0) {
        host.innerHTML = '<p style="font-size:var(--text-sm);color:var(--color-text-light);">No shipments registered yet.</p>';
        return;
      }
      host.innerHTML = shipments.map(s => {
        const stage = K.STAGES[s.currentStageIndex];
        return `
          <div class="shipment-row ${s.trackingNumber === selectedTracking ? 'active' : ''}" onclick="selectShipment('${s.trackingNumber}')">
            <div>
              <div style="font-family:var(--font-mono);font-weight:700;font-size:13px;">${s.trackingNumber}</div>
              <div style="font-size:12px;color:var(--color-text-light);">${s.customer.name} — ${stage.short}</div>
            </div>
            <span style="font-size:11px;">${s.shipping.method === 'air' ? '✈️' : '🚢'}</span>
          </div>
        `;
      }).join('');
    }

    function selectShipment(trackingNumber) {
      selectedTracking = trackingNumber;
      renderShipmentList();
      renderDetail();
    }

    function renderDetail() {
      const host = document.getElementById('shipment-detail');
      const s = K.loadShipment(selectedTracking);
      if (!s) {
        host.innerHTML = `<div class="card" style="padding:var(--space-12);text-align:center;color:var(--color-text-light);">Register or select a shipment to manage its tracking stages.</div>`;
        return;
      }

      const stagesHtml = K.STAGES.map((stage, i) => {
        const historyEntry = s.history.find(h => h.stageId === stage.id);
        const state = i < s.currentStageIndex ? 'done' : i === s.currentStageIndex ? 'current' : 'pending';
        const icon = state === 'done' ? '✓' : state === 'current' ? '●' : '○';
        const canSend = i === s.currentStageIndex || i === s.currentStageIndex + 1;
        return `
          <div class="stage-item">
            <div class="stage-dot ${state}">${icon}</div>
            <div style="flex:1;">
              <div style="font-weight:700;font-size:var(--text-sm);">${stage.label}</div>
              ${historyEntry ? `
                <div style="font-size:12px;color:var(--color-text-light);">
                  ${new Date(historyEntry.date).toLocaleString()} ${historyEntry.notified ? '· 📧 Notified' : '· ⚠️ Not yet notified'}
                </div>
              ` : ''}
            </div>
            ${i === s.currentStageIndex && !historyEntry.notified ? `<button class="btn btn--outline btn--sm" onclick="openSendModal('${s.trackingNumber}','${stage.id}')">Send Update</button>` : ''}
            ${i === s.currentStageIndex + 1 ? `<button class="btn btn--primary btn--sm" onclick="openAdvanceModal('${s.trackingNumber}','${stage.id}')">Advance & Send</button>` : ''}
          </div>
        `;
      }).join('');

      host.innerHTML = `
        <div class="card" style="padding:var(--space-8);">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:var(--space-6);flex-wrap:wrap;gap:var(--space-3);">
            <div>
              <div style="font-family:var(--font-mono);font-size:var(--text-lg);font-weight:700;color:var(--color-navy);">${s.trackingNumber}</div>
              <div style="font-size:var(--text-sm);color:var(--color-text-light);">${s.customer.name} · ${s.customer.email} · ${s.customer.phone}</div>
            </div>
            <div style="text-align:right;">
              <span class="product-card__badge" style="position:static;display:inline-block;">${s.shipping.method === 'air' ? '✈️ Air' : '🚢 Sea'}</span>
              <div style="font-size:12px;color:var(--color-text-light);margin-top:4px;">${s.goods.description}</div>
            </div>
          </div>
          <h4 style="font-size:var(--text-sm);text-transform:uppercase;letter-spacing:.04em;color:var(--color-gray);margin-bottom:var(--space-3);">Tracking Timeline</h4>
          ${stagesHtml}
        </div>
      `;
    }

    function openAdvanceModal(trackingNumber, stageId) { openSendModal(trackingNumber, stageId, true); }

    function openSendModal(trackingNumber, stageId, isAdvance) {
      const s = K.loadShipment(trackingNumber);
      const stage = K.STAGES.find(st => st.id === stageId);
      document.getElementById('modal-root').innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
          <div class="modal-box">
            <h3 style="margin-bottom:var(--space-2);">${isAdvance ? 'Advance to' : 'Send Update for'}: ${stage.label}</h3>
            <p style="font-size:var(--text-sm);color:var(--color-text-light);margin-bottom:var(--space-5);">
              Send this shipment update to <strong>${s.customer.email}</strong>?
            </p>
            <div class="form-group" style="margin-bottom:var(--space-4);">
              <label class="form-label">Location / Notes (optional)</label>
              <textarea id="modal-notes" class="form-control" rows="3" placeholder="e.g. Douala International Airport"></textarea>
            </div>
            <div style="display:flex;gap:var(--space-3);">
              <button class="btn btn--outline" style="flex:1;" onclick="closeModal()">Cancel</button>
              <button class="btn btn--primary" style="flex:1;" onclick="confirmSend('${trackingNumber}','${stageId}', ${!!isAdvance})">Send Notification</button>
            </div>
          </div>
        </div>
      `;
    }

    function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

    function confirmSend(trackingNumber, stageId, isAdvance) {
      const notes = document.getElementById('modal-notes').value.trim();
      let s = K.loadShipment(trackingNumber);

      if (isAdvance) {
        s = K.advanceStage(trackingNumber, stageId, { updatedBy: 'Staff', notes });
      }

      const stage = K.STAGES.find(st => st.id === stageId);
      const result = window.KenneNotifications ? window.KenneNotifications.notifyClient({
        ref: trackingNumber,
        clientName: s.customer.name,
        clientEmail: s.customer.email,
        clientPhone: s.customer.phone,
        origin: 'China',
        destination: 'Cameroon',
        service: stage.label,
        itemDescription: s.goods.description + (notes ? ` — ${notes}` : ''),
      }) : null;

      K.markStageNotified(trackingNumber, stageId);
      closeModal();
      if (typeof showToast === 'function') showToast(`✓ Update sent for ${trackingNumber} — ${stage.short}`);
      renderShipmentList();
      renderDetail();
    }

    document.getElementById('register-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const method = document.getElementById('r-method').value;
      const shipment = K.registerShipment({
        customer: {
          name: document.getElementById('r-name').value.trim(),
          email: document.getElementById('r-email').value.trim(),
          phone: document.getElementById('r-phone').value.trim(),
        },
        goods: { description: document.getElementById('r-goods').value.trim() },
        shipping: { method, cost: Number(document.getElementById('r-cost').value || 0), currency: 'CFA' },
      });

      if (window.KenneNotifications) {
        window.KenneNotifications.notifyClient({
          ref: shipment.trackingNumber,
          clientName: shipment.customer.name,
          clientEmail: shipment.customer.email,
          clientPhone: shipment.customer.phone,
          origin: 'China', destination: 'Cameroon',
          service: 'Shipment Registered',
          itemDescription: shipment.goods.description,
        });
      }
      K.markStageNotified(shipment.trackingNumber, 'registered');

      this.reset();
      selectedTracking = shipment.trackingNumber;
      renderShipmentList();
      renderDetail();
      if (typeof showToast === 'function') showToast(`✅ Shipment ${shipment.trackingNumber} registered & customer notified`);
    });

    document.addEventListener('DOMContentLoaded', renderShipmentList);
  </script>
  <script src="../assets/js/site-extras.js"></script>
</body>
</html>
